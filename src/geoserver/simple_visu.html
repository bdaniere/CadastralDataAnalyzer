<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Carte cadastrale</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css"
    />

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>

<script>

//
// Fond de carte OSM
//
const osm = new ol.layer.Tile({
    source: new ol.source.OSM()
});

//
// Couche WMS Communes
//
const communes = new ol.layer.Tile({
    source: new ol.source.TileWMS({
        url: 'http://localhost:8080/geoserver/raw_data_workspace/wms',
        params: {
            LAYERS: 'raw_data_workspace:communes',
            TILED: true
        },
        serverType: 'geoserver'
    })
});

//
// Couche WMS Bâtiments
//
const batiments = new ol.layer.Tile({
    source: new ol.source.TileWMS({
        url: 'http://localhost:8080/geoserver/raw_data_workspace/wms',
        params: {
            LAYERS: 'raw_data_workspace:batiments',
            TILED: true
        },
        serverType: 'geoserver'
    })
});

//
// Couche WMS Bâtiments
//
const parcelles = new ol.layer.Tile({
    source: new ol.source.TileWMS({
        url: 'http://localhost:8080/geoserver/raw_data_workspace/wms',
        params: {
            LAYERS: 'raw_data_workspace:parcelles',
            TILED: true
        },
        serverType: 'geoserver'
    })
});

//
// Couche WMS Bâtiments
//
const adresses = new ol.layer.Tile({
    source: new ol.source.TileWMS({
        url: 'http://localhost:8080/geoserver/raw_data_workspace/wms',
        params: {
            LAYERS: 'raw_data_workspace:base_adresse_nationale',
            TILED: true
        },
        serverType: 'geoserver'
    })
});

//
// Carte
//
const map = new ol.Map({
    target: 'map',
    layers: [
        osm,
        communes,
        parcelles,
        batiments,
        adresses
    ],
    view: new ol.View({
        center: ol.proj.fromLonLat([2.35, 48.85]),
        zoom: 6
    })
});

//
// Source WFS utilisée uniquement
// pour récupérer l'emprise des communes
//
const communesExtentSource = new ol.source.Vector({
    format: new ol.format.GeoJSON(),

    url:
        'http://localhost:8080/geoserver/raw_data_workspace/ows?' +
        'service=WFS&' +
        'version=1.0.0&' +
        'request=GetFeature&' +
        'typeName=raw_data_workspace:communes&' +
        'outputFormat=application/json&' +
        'srsName=EPSG:3857'
});

//
// Zoom automatique sur les communes
//
communesExtentSource.once('featuresloadend', function () {

    const extent = communesExtentSource.getExtent();

    map.getView().fit(extent, {
        padding: [50, 50, 50, 50],
        duration: 1000,
        maxZoom: 16
    });

});

</script>

</body>
</html>
