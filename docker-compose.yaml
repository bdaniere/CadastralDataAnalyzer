services: 
  postgis:
    image: postgis/postgis:16-3.4
    container_name: my_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cadastral_data
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cadastral_data_analyser_network

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.x
    container_name: my_geoserver
    environment :
      GEOSERVER_ADMIN_USER : admin
      GEOSERVER_ADMIN_PASSWORD : admin
    ports:
      - "8080:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data
    depends_on : 
      - postgis
    networks:
      - cadastral_data_analyser_network

networks:
  cadastral_data_analyser_network:
    driver: bridge

volumes:
  postgres_data:
  geoserver_data: